function displayMenu(items){

const container=document.getElementById('menuContainer');
container.innerHTML='';

items.forEach(item=>{

container.innerHTML+=`
<div class="card">

<img src="${item.image}?auto=format&fit=crop&w=800&q=80">

<div class="card-content">

<h3>${item.name}</h3>

<div class="price">${item.price}</div>

<p class="desc">${item.description}</p>

<a class="whatsapp"
href="https://wa.me/213770059543?text=Bonjour%20je%20souhaite%20commander%20${encodeURIComponent(item.name)}"
target="_blank">

Commander

</a>

</div>

</div>
`;

});

}

function filterMenu(category){

if(category==="all"){
displayMenu(menu);
return;
}

displayMenu(
menu.filter(item=>item.category===category)
);

}

document.getElementById('search').addEventListener('keyup',function(){

const value=this.value.toLowerCase();

displayMenu(
menu.filter(item=>
item.name.toLowerCase().includes(value)
)
);

});

displayMenu(menu);
